<style>
@font-face{font-family:Noori;src:url(../fonts/JameelNooriNastaleeq.woff2) format('woff2');font-display:swap}
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri2:#0d3b66;--ok:#15803d;--red:#b91c1c;--gold:#b45309}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2e;--ink:#e2e8f0;--mut:#94a3b8;--line:#22314d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Noori,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.9}
.num,input,button,select,textarea{font-family:'Segoe UI',Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:14px 16px 18px}
header h1{margin:0;font-size:22px}header small{display:block;opacity:.85;font-size:13px}
main{max-width:760px;margin:-10px auto 30px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h2{font-size:18px;margin:0 0 6px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:var(--line);color:var(--ink)}button.red{background:#fee2e2;color:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.st b{display:block;font-size:22px;font-family:'Segoe UI',Arial,sans-serif}.st span{font-size:12.5px;color:var(--mut)}
.st.bal b{color:var(--ok)}
.row{border-bottom:1px solid var(--line);padding:8px 2px;font-size:14px}.row:last-child{border:0}
.tag{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}
.t-ok{background:#dcfce7;color:var(--ok)}.t-w{background:#fef3c7;color:var(--gold)}.t-n{background:var(--line);color:var(--mut)}
.err{color:var(--red);font-weight:800;min-height:1.4em}
.chat{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.m{max-width:82%;border-radius:12px;padding:6px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-start;background:#dcfce7;color:#064e3b}.m.th{align-self:flex-end;background:var(--line)}
.m img{max-width:100%;border-radius:8px;display:block;margin-top:4px}.m audio{width:220px;max-width:100%}
.m small{display:block;font-size:10.5px;opacity:.7;font-family:Arial}
.att{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.att label{margin:0;display:inline-block;background:var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:13px}
.att input[type=file]{display:none}
.hid{display:none!important}
.prev img{max-height:90px;border-radius:8px;margin-top:6px}
.ag{cursor:pointer}.ag:hover{background:rgba(15,118,110,.06)}
.cp{padding:1px 8px!important;font-size:12px!important;border-radius:8px!important;background:#ecfeff!important;color:var(--pri)!important;border:1px solid var(--pri)!important;vertical-align:middle}
#tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:12px;padding:8px 14px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#tst.on{opacity:1}
.fin{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}.fin th,.fin td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:right}.fin td.num{text-align:left;font-weight:800;font-family:'Segoe UI',Arial}.fin tr.tot td{border-top:2px solid var(--ink);font-weight:900}
@media print{header,.foot,.noP,#tst{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}main{margin:0;max-width:none}}
.foot{text-align:center;font-size:12px;color:var(--mut);margin:20px 0}
</style>

<body>
<header style="position:relative"><button onclick="openHelpDesk()" title="Help Desk — مسائل و تجاویز" style="position:absolute;left:12px;top:12px;background:none;padding:0;border:0"><span class="pbthd-sos" style="display:inline-flex;align-items:center;gap:4px;background:linear-gradient(#fde047,#facc15);color:#111;border-radius:999px;padding:2px 9px;font:800 12px/1.35 Arial,sans-serif;box-shadow:0 2px 0 #ca8a04;white-space:nowrap;vertical-align:middle;direction:ltr"><b style="background:#111;color:#facc15;border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-size:11px">?</b>Help Desk</span></button><h1 id="hdT">🤝 MCS Agent</h1><small id="hdS">ایجنٹ · کو-ڈویلپر · ڈویلپر — PBT Code Labs</small></header>
<main id="app"></main>
<div class="foot"><a href="guide.html" style="color:var(--pri);font-weight:800">📄 How to Become an MCS Agent (Print / PDF)</a><br><a href="#" onclick="roleSwitch();return false" style="color:var(--pri);font-weight:800">🔄 Switch Login (Agent / Co-Developer / Developer)</a><br>PBT Code Labs · <span class="num" id="agpVer">AGP1111WE032</span></div>
<script>
const API = 'https://aio-pos-verify.pbtcodelabs.workers.dev';
const FB_KEY = 'AIzaSyAvu8ymIZAGEPaYwd_LBJzKS2lZ3Q4_Mog'; // My City Shines (ایڈمن لاگ اِن)
const $ = s => document.querySelector(s), app = $('#app');
const E = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const N = n => (+n || 0).toLocaleString('en-PK');
/* AGP0511TH002: ہر ریفرل نمبر / ID کے ساتھ 📋 کاپی */
const CP = v => `<button class="cp" onclick="cpy('${E(v)}')">📋 کاپی</button>`;
function cpy(v){ const done = () => toast('📋 Copied: ' + v); try{ navigator.clipboard.writeText(v).then(done, () => prompt('Copy', v)); }catch(e){ prompt('Copy', v); } }
function toast(t){ let el = document.getElementById('tst'); if(!el){ el = document.createElement('div'); el.id = 'tst'; document.body.appendChild(el); } el.textContent = t; el.className = 'on'; clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 2200); }
const D = t => t ? new Date(t).toLocaleDateString('en-GB') : '—';
const ls = { get(k, d){ try{ const v = localStorage.getItem('agp_' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem('agp_' + k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem('agp_' + k); }catch(e){} } };
/* AGP0911MO013 (مالک کا حکم، ہیلپ ڈیسک #174): ایک ہی «PBT Portal» ایپ (APK) — پہلے صفحے پر تین لاگ اِن؛ پچھلا چنا ہوا کردار یاد (agp_role) */
const AGP_VER = 'AGP1111WE032';
const ROLE = location.hash.startsWith('#admin') ? 'admin' : location.hash.startsWith('#codev') ? 'codev' : location.hash.startsWith('#agent') ? 'agent' : (ls.get('role', '') || '');
const ADMIN = ROLE === 'admin', CODEV = ROLE === 'codev';
function roleGo(r){ ls.set('role', r); location.hash = '#' + r; location.reload(); }
function roleSwitch(){ ls.del('role'); history.replaceState(null, '', location.pathname); location.reload(); }
function rolePick(){
  const b = (r, ic, t, c) => `<button onclick="roleGo('${r}')" style="display:flex;align-items:center;justify-content:center;gap:10px;width:min(260px,82%);margin:10px auto;padding:12px 16px;border-radius:16px;background:${c};font-size:18px"><span style="font-size:28px">${ic}</span><span style="font-family:Noori,serif;line-height:1.5">${t}</span></button>`;
  app.innerHTML = `<div class="card" style="text-align:center"><h2>👋 خوش آمدید — اپنا لاگ اِن چنیں</h2>
    ${b('agent','🤝','MCS ایجنٹ','linear-gradient(135deg,#0f766e,#0d9488)')}
    ${b('codev','👥','کو-ڈویلپر','linear-gradient(135deg,#b45309,#d97706)')}
    ${b('admin','👨‍💻','ڈویلپر (مالک)','linear-gradient(135deg,#0d3b66,#1e40af)')}
    <div style="color:var(--mut);font-size:13px;text-align:center">ایک بار لاگ اِن کریں — ایپ اگلی بار یاد رکھے گی</div></div>`;
}
let CDV = null;   /* AGP0511TH005: کو-ڈویلپر {phone, pin} — صرف دیکھنا */
let S = null, admTok = null, admTokExp = 0, admList = [], admRate = 0, admCode = '';
async function post(path, body, tok){ const r = await fetch(API + path, {method:'POST', headers: Object.assign({'Content-Type':'text/plain'}, tok ? {Authorization: 'Bearer ' + tok} : {}), body: JSON.stringify(body)}); return r.json(); }
function shrink(file, max, q){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src); res(c.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = URL.createObjectURL(file); }); }
const att = { img: '', audio: '' }; let rec = null;
function attHtml(){ return `<div class="att"><label>🖼️ تصویر<input type="file" accept="image/*" onchange="pickImg(this)"></label><label onclick="event.preventDefault();toggleRec()" id="recBtn">🎤 آواز</label><span id="attInfo" class="num" style="font-size:12px"></span></div><div class="prev" id="attPrev"></div>`; }
async function pickImg(inp){ const f = inp.files && inp.files[0]; if(!f) return; att.img = await shrink(f, 1100, .72); $('#attPrev').innerHTML = `<img src="${att.img}">`; }
async function toggleRec(){
  if(rec){ rec.stop(); return; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true}); const ch = []; rec = new MediaRecorder(st); const t0 = Date.now();
    rec.ondataavailable = e => ch.push(e.data);
    rec.onstop = () => { st.getTracks().forEach(t => t.stop()); const bl = new Blob(ch, {type: rec.mimeType || 'audio/webm'}); rec = null; $('#recBtn').textContent = '🎤 آواز';
      const fr = new FileReader(); fr.onload = () => { att.audio = fr.result; $('#attInfo').textContent = '🎤 ' + Math.round((Date.now()-t0)/1000) + 's'; }; fr.readAsDataURL(bl); };
    rec.start(); $('#recBtn').textContent = '⏹ روکیں'; setTimeout(() => { if(rec) rec.stop(); }, 60000);
  }catch(e){ alert('مائیک کی اجازت نہیں ملی'); }
}
function chatHtml(msgs, mine){ return `<div class="chat" id="chat">${(msgs||[]).map(m => `<div class="m ${m.who === mine ? 'me' : 'th'}">${E(m.text)}${m.img ? `<img src="${m.img}">` : ''}${m.audio ? `<audio controls src="${m.audio}"></audio>` : ''}<small>${m.who === 'dev' ? 'ڈویلپر' : 'ایجنٹ'} · ${new Date(m.ts).toLocaleString('en-GB')}</small></div>`).join('') || '<div class="row" style="color:var(--mut)">ابھی کوئی پیغام نہیں</div>'}</div>
  <textarea id="msgTx" rows="2" placeholder="پیغام لکھیں…" dir="auto"></textarea>${attHtml()}<div class="btns"><button onclick="sendMsg()">📨 بھیجیں</button></div>`; }
function scrollChat(){ const c = $('#chat'); if(c) c.scrollTop = c.scrollHeight; }
function summaryHtml(s){
  return `<div class="stats">
    <div class="st"><b>${N(s.refs.length)}</b><span>🏪 لگوائے کاروبار</span></div>
    <div class="st"><b>${N(s.refs.filter(r => r.paid > 0).length)}</b><span>⭐ جاری (خریدے) کاروبار</span></div>
    <div class="st"><b>${N(s.years)}</b><span>📅 کل خریدے سال</span></div>
    <div class="st"><b class="num">Rs ${N(s.due)}</b><span>💰 کل کمیشن (${N(s.rate)} فی سال)</span></div>
    <div class="st"><b class="num">Rs ${N(s.paidOut)}</b><span>✅ ادا ہو چکا</span></div>
    <div class="st bal"><b class="num">Rs ${N(s.balance)}</b><span>📌 بقایا</span></div></div>`;
}
function refsHtml(s){ return (s.refs||[]).map(r => { const live = r.until > Date.now(); const tg = r.paid > 0 ? (live ? '<span class="tag t-ok">⭐ جاری</span>' : '<span class="tag t-w">⏰ مدت ختم</span>') : (live ? '<span class="tag t-n">🎁 مفت دن</span>' : '<span class="tag t-n">⏳ ابھی جاری نہیں</span>');
  return `<div class="row"><b>${E(r.name)}</b> ${tg}<br><small>${E(r.cat)} · ${E(r.city)} · <span class="num">${E(r.phone)}</span> · درج: ${D(r.at)}${r.until ? ' · مدت: ' + D(r.until) : ''} · سال: ${N(r.paid)}</small><br><small class="num" style="color:var(--mut)">ID: ${E(r.rk)}</small> ${CP(r.rk)}</div>`; }).join('') || '<div class="row" style="color:var(--mut)">ابھی کوئی کاروبار نہیں</div>'; }
function paysHtml(s, adm){ return (s.pays||[]).map(p => `<div class="row">✅ <b class="num">Rs ${N(p.amount)}</b> — ${E(p.note)} <small class="num">${D(p.ts)}</small>${adm ? ` <button class="red" style="padding:2px 8px" onclick="admUnpay(${p.id})">✕</button>` : ''}</div>`).join('') || '<div class="row" style="color:var(--mut)">ابھی کوئی ادائیگی نہیں</div>'; }
function proofsHtml(s, adm){ return (s.proofs||[]).map(p => `<div class="row">${p.done ? '✅' : '⏳'} <b class="num">${E(p.rk)}</b> — ${E(p.note)} <small class="num">${D(p.ts)}</small>${adm && p.img ? `<br><img src="${p.img}" style="max-height:160px;border-radius:8px">` : ''}${adm && !p.done ? ` <button style="padding:2px 8px" onclick="admProofDone(${p.id})">✔ ہو گیا</button>` : ''}</div>`).join('') || '<div class="row" style="color:var(--mut)">کوئی ثبوت نہیں</div>'; }
/* ===== ایجنٹ ===== */
function agLogin(msg){
  app.innerHTML = `<div class="card"><h2>🔐 لاگ اِن</h2><div style="color:var(--mut);font-size:14px">موبائل نمبر اور وہ PIN جو منظوری پر ملا (سٹی شائنز ایپ میں «🤝 MCS ایجنٹ» میں بھی لکھا ہے)۔</div>
    <label>📱 موبائل نمبر</label><input id="lp" inputmode="tel" dir="ltr" value="${E((ls.get('me')||{}).phone||'')}">
    <label>🔑 PIN</label><input id="lpin" inputmode="numeric" dir="ltr" maxlength="6">
    <div class="err" id="lerr">${E(msg||'')}</div><div class="btns"><button onclick="agDoLogin()">✅ داخل ہوں</button><button class="sec" onclick="forgotPin('ag')">🔑 PIN بھول گئے؟</button></div><div id="fpBox"></div></div>
    <div class="card"><h2>🎬 MCS ایجنٹ کیسے بنیں؟</h2><video src="../help/media/promo/MCS-Agent-Banen-ur.mp4" controls playsinline preload="metadata" style="width:100%;max-height:70vh;border-radius:12px;background:#000"></video>
      <div class="btns"><a href="guide.html" target="_blank" rel="noopener"><button>📄 پورا طریقہ پڑھیں (PDF / پرنٹ)</button></a><a href="MCS-Agent-Guide.pdf" download><button class="sec">⬇️ PDF ڈاؤن لوڈ</button></a><a href="../help/media/promo/MCS-Agent-Banen-ur.mp4" download><button class="sec">⬇️ ویڈیو ڈاؤن لوڈ</button></a></div></div>
    <div class="card" style="text-align:center"><a href="#" onclick="roleGo('codev');return false" style="color:var(--pri);font-weight:800">👥 کو-ڈویلپر — کمپنی کا حساب دیکھیں</a></div>`;
}
/* AGP0511TH005 (مالک کا حکم): کو-ڈویلپر — موبائل + PIN (سٹی شائنز کا کو-ڈویلپر PIN)؛ کمپنی کا حساب صرف دیکھنا، کچھ بدل نہیں سکتا */
function cdLogin(msg){
  const me = ls.get('cd') || {};
  app.innerHTML = `<div class="card"><h2>👥 کو-ڈویلپر — لاگ اِن</h2><div style="color:var(--mut);font-size:14px">وہی موبائل نمبر اور PIN جو سٹی شائنز کے «👥 کو-ڈویلپر جانچ موڈ» میں ہے۔ یہاں صرف حساب دیکھ سکتے ہیں — بدلنے کا اختیار صرف ڈویلپر کے پاس ہے۔</div>
    <label>📱 موبائل نمبر</label><input id="cp" inputmode="tel" dir="ltr" value="${E(me.phone||'')}">
    <label>🔑 PIN</label><input id="cpin" inputmode="numeric" dir="ltr" maxlength="6" onkeydown="if(event.key==='Enter')cdDoLogin()">
    <div class="err">${E(msg||'')}</div><div class="btns"><button onclick="cdDoLogin()">✅ داخل ہوں</button><button class="sec" onclick="forgotPin('cd')">🔑 PIN بھول گئے؟</button></div><div id="fpBox"></div></div>`;
}
async function cdDoLogin(){ const phone = $('#cp').value.trim(), pin = $('#cpin').value.trim(); if(!phone || !pin) return; CDV = {phone, pin};
  try{ const r = await post('/cdfin', {phone, pin, mon: monNow()}); if(!r || !r.ok){ CDV = null; return cdLogin('❌ نمبر یا PIN غلط'); } ls.set('cd', {phone, pin}); CDV.name = r.name; admFin(); }catch(e){ CDV = null; cdLogin('📶 انٹرنیٹ نہیں'); } }
function cdLogout(){ CDV = null; ls.set('cd', {phone: (ls.get('cd')||{}).phone}); cdLogin(); }
/* AGP0511TH006 (مالک کا حکم): مسئلہ / مشورہ سیدھا PBT Help Desk میں (وہاں مالک منظور کرے تو کام شروع) — چیٹ صرف ڈویلپر سے بات کے لیے */
function hdLink(prefix, name, phone){ const q = new URLSearchParams({app:'MCS', text: prefix + '\n', name: name || '', phone: phone || '', type: 'idea'}); return 'https://pbtcodelabs-pbt.github.io/help/?' + q.toString() + '#/new/MCS'; }
function hdBox(prefix, name, phone){ return `<div class="card" style="border:2px dashed var(--gold);background:#fffbeb"><h2>🛠️ ایپ میں مسئلہ یا نیا مشورہ؟</h2><div style="font-size:14px;color:var(--mut)">ایپ کی کوئی خرابی یا بہتری کا مشورہ یہاں سے بھیجیں — سیدھا ڈویلپر کی منظوری کی فہرست میں جائے گا اور منظوری کے بعد کام شروع ہوگا۔ (عام بات چیت اور رسید نیچے چیٹ میں)</div><div class="btns"><a href="${E(hdLink(prefix, name, phone))}" target="_blank" rel="noopener"><button>🛠️ مسئلہ / مشورہ — Help Desk میں بھیجیں</button></a></div></div>`; }
let THR = '';   /* ایڈمن: کھلا ہوا چیٹ دھاگہ (ایجنٹ کوڈ یا CD-<نمبر>) */
async function cdChatView(x){
  const r = await post('/cdchat', Object.assign({phone: CDV.phone, pin: CDV.pin}, x || {})); if(!r || !r.ok) return cdLogin('دوبارہ لاگ اِن کریں');
